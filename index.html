<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Counter Pro</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	
</head>
<body>

	<header>
		<h1>Counter Pro</h1>	
	</header>
	
	<main>
		<h2 id="counted">0</h2>
		<p>Current Count</p>

		<div>
			<button id="plus-btn" onclick="plus()">Plus</button>
			<div class="dropdown">
			  <button class="dropbtn">Dropdown</button>
			  <div class="dropdown-content">
			    <a href="#" id="plus-one-option" onclick="userSumOption(1)">+1</a>
			    <a href="#" id="plus-five-option" onclick="userSumOption(5)">+5</a>
			    <a href="#" id="plus-ten-option" onclick="userSumOption(10)">+10</a>
			  </div>
			</div>

			<button id="minus-btn" onclick="minus()">Minus</button>
			<button id="reset-btn" onclick="reset()">Reset</button>
			<button id="save-btn" onclick="save()">Save</button>

			<h3>Activity Log</h3>
			<p id="savedInformation"></p>
		</div>
	</main>
	
	<script src="script.js"></script>

</body>
</html>
